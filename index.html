      // SPA redirect per GitHub Pages — decodifica il path dal 404.html
      (function (l) {
        if (l.search[1] === 'p') {
          var params = l.search
            .slice(1)
            .split('&')
            .reduce(function (p, s) {
              var parts = s.split('=');
              p[parts[0]] = parts.slice(1).join('=').replace(/~and~/g, '&');
              return p;
            }, {});
          if (params.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              '/' +
                params.p +
                (params.q ? '?' + params.q : '') +
                l.hash
            );
          }
        }
      })(window.location);
